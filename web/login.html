<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cadet · Sign in</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root { --bg: #0b0e17; --surface: #111522; --raised: #171c2d; --line-2: #2f3856; --text: #e6e9f2; --muted: #8791ae; --accent: #4c8dff; --bad: #f0566a; }
* { box-sizing: border-box; }
html { background: var(--bg); overscroll-behavior: none; }
html, body { margin: 0; min-height: 100%; }
body { min-height: 100dvh; background: radial-gradient(1200px 600px at 50% -10%, #182044 0, var(--bg) 60%); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; display: grid; place-items: center; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); -webkit-font-smoothing: antialiased; }
form { width: min(380px, 100%); padding: 28px 24px 24px; border: 1px solid var(--line-2); border-radius: 16px; background: rgba(17,21,34,.9); box-shadow: 0 24px 60px rgba(0,0,0,.5); }
.mark { width: 44px; height: 44px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--accent); margin: 0 auto 14px; }
.mark svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
h1 { margin: 0; text-align: center; font-size: 20px; font-weight: 650; }
p { margin: 4px 0 20px; text-align: center; color: var(--muted); font-size: 13px; }
input { width: 100%; height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg); color: inherit; font: inherit; font-size: 16px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { width: 100%; height: 46px; margin-top: 12px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; }
.err { min-height: 1.3em; margin-top: 12px; text-align: center; color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<form id="f">
  <div class="mark"><svg viewBox="0 0 24 24"><path d="M12 3c3.5 3.2 4.6 7.5 3.6 13H8.4C7.4 10.5 8.5 6.2 12 3z"/><path d="M8.4 14 5 17.5M15.6 14l3.4 3.5"/></svg></div>
  <h1>Cadet</h1>
  <p>Sign in to see your fleet.</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus aria-label="Password">
  <button id="go">Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
f.onsubmit = async (e) => {
  e.preventDefault(); go.disabled = true; err.textContent = "";
  try {
    const res = await fetch("/auth/login", { method: "POST", body: JSON.stringify({ password: document.getElementById("pw").value }) });
    const data = await res.json().catch(() => ({}));
    if (res.ok) return location.replace("/");
    err.textContent = data.error || "Could not sign in";
  } catch { err.textContent = "Could not reach Cadet"; }
  go.disabled = false;
};
</script>
</body>
</html>
