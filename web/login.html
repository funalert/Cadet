<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123150">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cadet · Sign in</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root { --space: #07152a; --ink: #040d1a; --panel: #123150; --raised: #1b4366; --field: #0a2036; --text: #f4eedf; --muted: #bfd7ea; --sunny: #ffc23d; --navy: #14304a; --bad: #ff9a7a; --display: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif; }
* { box-sizing: border-box; }
html { background: var(--space); overscroll-behavior: none; }
html, body { margin: 0; min-height: 100%; }
body { min-height: 100dvh; background: radial-gradient(900px 560px at 70% -10%, #1d4a78 0, transparent 62%), linear-gradient(#0a1c33, #050f1c); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Avenir Next", system-ui, sans-serif; display: grid; place-items: center; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); -webkit-font-smoothing: antialiased; }
form { width: min(380px, 100%); padding: 28px 24px 24px; border: 3px solid var(--ink); border-radius: 24px; background: var(--panel); box-shadow: 0 8px 0 var(--ink), 0 30px 60px rgba(0,0,0,.5); }
.mark { width: 56px; height: 56px; border-radius: 50%; background: var(--sunny); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); display: grid; place-items: center; color: var(--navy); margin: 0 auto 14px; }
.mark svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
h1 { margin: 0; text-align: center; font: 800 24px var(--display); }
p { margin: 4px 0 20px; text-align: center; color: var(--muted); font-size: 13.5px; }
input { width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; border: 2.5px solid var(--ink); background: var(--field); color: inherit; font: inherit; font-size: 16px; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--sunny); outline-offset: 2px; }
button { width: 100%; height: 48px; margin-top: 14px; border-radius: 12px; border: 2.5px solid var(--ink); background: var(--sunny); color: var(--navy); box-shadow: 0 3px 0 var(--ink); font: 800 16px var(--display); cursor: pointer; }
button:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
button:disabled { opacity: .5; }
.err { min-height: 1.3em; margin-top: 12px; text-align: center; color: var(--bad); font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<form id="f">
  <div class="mark"><svg viewBox="0 0 24 24"><path d="M12 3c3.5 3.2 4.6 7.5 3.6 13H8.4C7.4 10.5 8.5 6.2 12 3z"/><path d="M8.4 14 5 17.5M15.6 14l3.4 3.5"/></svg></div>
  <h1>Cadet</h1>
  <p>Sign in to see your fleet.</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus aria-label="Password">
  <button id="go">Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
f.onsubmit = async (e) => {
  e.preventDefault(); go.disabled = true; err.textContent = "";
  try {
    const res = await fetch("/auth/login", { method: "POST", body: JSON.stringify({ password: document.getElementById("pw").value }) });
    const data = await res.json().catch(() => ({}));
    if (res.ok) return location.replace("/");
    err.textContent = data.error || "Could not sign in";
  } catch { err.textContent = "Could not reach Cadet"; }
  go.disabled = false;
};
</script>
</body>
</html>
